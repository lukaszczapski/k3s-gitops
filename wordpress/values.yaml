global:
  storageClass: "longhorn"
  imageRegistry: "mirror.gcr.io"  # Wymuszenie globalne dla Bitnami

image:
  registry: mirror.gcr.io
  repository: bitnami/wordpress

mariadb:
  image:
    registry: mirror.gcr.io
    repository: bitnami/mariadb
  primary:
    persistence:
      storageClass: "longhorn"

ingress:
  enabled: false
